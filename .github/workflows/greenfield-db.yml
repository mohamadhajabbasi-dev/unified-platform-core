name: Greenfield PostgreSQL tests
on:
  push:
    paths:
      - 'db/**'
      - '.github/workflows/greenfield-db.yml'
  pull_request:
    paths:
      - 'db/**'
      - '.github/workflows/greenfield-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: upc_greenfield_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d upc_greenfield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate migration IDs and matching SQL tests
        run: python3 db/check_migrations.py
      - name: Apply ordered greenfield migrations
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          for migration in db/migrations/*.sql; do
            echo "Applying $migration"
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -d upc_greenfield_test -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Run synthetic acceptance tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          for test in db/tests/*.sql; do
            echo "Testing $test"
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -d upc_greenfield_test -v ON_ERROR_STOP=1 < "$test"
          done
      - name: Run concurrent identity acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/identity.sh
      - name: Run concurrent inventory acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/inventory.sh
      - name: Run concurrent sales acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/sales.sh

      - name: Run concurrent pricing acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/pricing.sh

      - name: Run concurrent procurement acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/procurement.sh

      - name: Run concurrent supplier settlement acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/supplier_settlement.sh

      - name: Run concurrent transfer acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/transfer.sh

      - name: Run concurrent tracked serial acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/serial.sh

      - name: Run concurrent business location acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/business_locations.sh

      - name: Run concurrent dormant site acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/sites.sh

      - name: Run concurrent COGS acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/cogs.sh

  return-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: upc_greenfield_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d upc_greenfield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate migration IDs and matching SQL tests
        run: python3 db/check_migrations.py
      - name: Verify actual committed return history upgrade
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/upgrade/0058_return_history.sh
