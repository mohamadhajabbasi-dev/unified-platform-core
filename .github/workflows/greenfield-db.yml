          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/incident_reports.sh

      - name: Run concurrent tenant backup request acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/tenant_backup_requests.sh

      - name: Run concurrent product favorite acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
