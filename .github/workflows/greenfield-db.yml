      - name: Run concurrent reorder policy acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/reorder_policies.sh

      - name: Run concurrent shipping method acceptance test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash db/tests/concurrency/shipping_methods.sh

      - name: Run concurrent incident report acceptance test
